# gym.ingok.ch – Gym Cockpit (statisch + api.php), Quelle Ai/gym/
# Achtung: aiscom-next-proxy.conf leitet serverweit ^/$ auf www.aiscom.ch/de um.
# mod_rewrite greift vor mod_alias und liefert hier stattdessen index.html.
<VirtualHost *:80>
    ServerName gym.ingok.ch
    DocumentRoot /var/www/gym

    RewriteEngine On
    RewriteRule ^/$ /index.html [L]

    <Directory /var/www/gym>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # Service Worker und Seite immer frisch, Assets sind versioniert (?v=)
    <FilesMatch "^(index\.html|sw\.js|manifest\.webmanifest)$">
        Header set Cache-Control "no-cache"
    </FilesMatch>

    AddType application/manifest+json .webmanifest

    ErrorLog ${APACHE_LOG_DIR}/gym-error.log
    CustomLog ${APACHE_LOG_DIR}/gym-access.log combined
</VirtualHost>

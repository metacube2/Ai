<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /gitpusher/public

    <Directory /gitpusher/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /gitpusher/data>
        Require all denied
    </Directory>

    <Directory /gitpusher/src>
        Require all denied
    </Directory>

    <DirectoryMatch "^/deployments/.*/\.git">
        Require all denied
    </DirectoryMatch>

    ErrorLog ${APACHE_LOG_DIR}/gitpusher-error.log
    CustomLog ${APACHE_LOG_DIR}/gitpusher-access.log combined
</VirtualHost>

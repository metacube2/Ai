# bier.ingok.ch – Funkerbier-Terminsuche (statisch + api.php), Quelle Ai/funkerbier/
# Achtung: aiscom-next-proxy.conf leitet serverweit ^/$ auf www.aiscom.ch/de um.
# mod_rewrite greift vor mod_alias und liefert hier stattdessen index.html.
<VirtualHost *:80>
    ServerName bier.ingok.ch
    DocumentRoot /var/www/bier

    RewriteEngine On
    RewriteRule ^/$ /index.html [L]

    <Directory /var/www/bier>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # Seite immer frisch, Assets sind versioniert (?v=)
    <FilesMatch "^index\.html$">
        Header set Cache-Control "no-cache"
    </FilesMatch>
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer"

    AddType audio/x-mod .mod

    ErrorLog ${APACHE_LOG_DIR}/bier-error.log
    CustomLog ${APACHE_LOG_DIR}/bier-access.log combined
</VirtualHost>

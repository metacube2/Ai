# 2026-10-04: alte AISCOM-Seite (Next.js, Port 3000) ueber Apache.
# Nur eine Allowlist geht an Next; /macyaesu, /synth, /aiscanner usw.
# bleiben unveraendert bei Apache. Admin, Login, CMS und Portfolio-API
# von Next werden bewusst nicht weitergereicht.
RedirectMatch 302 ^/$ https://www.aiscom.ch/de
ProxyPreserveHost On
ProxyPassMatch "^/((de|en|it)(/.*)?)$" "http://127.0.0.1:3000/$1"
ProxyPassMatch "^/(_next/.*)$" "http://127.0.0.1:3000/$1"
ProxyPass /api/contact http://127.0.0.1:3000/api/contact
ProxyPass /api/upload http://127.0.0.1:3000/api/upload
ProxyPass /logo.jpg http://127.0.0.1:3000/logo.jpg
ProxyPass /favicon.ico http://127.0.0.1:3000/favicon.ico
<LocationMatch "^/api/(contact|upload)$">
    <LimitExcept POST>
        Require all denied
    </LimitExcept>
</LocationMatch>
# Quellcode, Datenbank und Kundendateien nie direkt ausliefern
<LocationMatch "^/aiscom/(frontend|database|backend)(/|$)">
    Require all denied
</LocationMatch>

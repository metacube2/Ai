# 2026-11-06: Testsektion und Update-Kanaele der schluesselfreien Tester-Fassungen nur mit Passwort (Benutzer + Adi).
# Offen bleiben /updates/taploop-tester/ (oeffentliche Seite /taploop/ holt dort Updates) und /updates/aurora-studio/.
# Passwortdatei: /etc/apache2/aiscom-tester.htpasswd (bcrypt), aendern: htpasswd -B /etc/apache2/aiscom-tester.htpasswd tester
<LocationMatch "^/(tester|updates/(antennen-studio|fotogedaechtnis|kamera-import|macyaesu|mietpruefer|obhut|stretcher)-tester)(/|$)">
    AuthType Basic
    AuthName "AISCOM Tester"
    AuthBasicProvider file
    AuthUserFile /etc/apache2/aiscom-tester.htpasswd
    Require valid-user
</LocationMatch>

<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1780" viewBox="0 0 1500 1780">
  <defs>
    <style>
      .bg { fill: #f7f8fa; }
      .title { font: 700 30px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 15px Arial, sans-serif; fill: #4b5563; }
      .box-title { font: 700 15px Arial, sans-serif; fill: #111827; }
      .txt { font: 400 13px Arial, sans-serif; fill: #1f2937; }
      .small { font: 400 12.5px Arial, sans-serif; fill: #1f2937; }
      .tiny { font: 400 11.5px Arial, sans-serif; fill: #4b5563; }
      .lane { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.2; }
      .prep { fill: #e8f2ff; stroke: #2563eb; stroke-width: 1.5; }
      .run { fill: #eaf8ef; stroke: #15803d; stroke-width: 1.5; }
      .check { fill: #fffbeb; stroke: #d97706; stroke-width: 1.5; }
      .issue { fill: #fff1f2; stroke: #be123c; stroke-width: 1.5; }
      .output { fill: #eef2ff; stroke: #4338ca; stroke-width: 1.5; }
      .new { stroke-dasharray: 5 4; }
      .line { stroke: #374151; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .line-yes { stroke: #15803d; stroke-width: 1.8; fill: none; marker-end: url(#arrowGreen); }
      .line-no { stroke: #be123c; stroke-width: 1.8; fill: none; marker-end: url(#arrowRed); }
      .lbl { font: 700 12px Arial, sans-serif; }
      .lbl-yes { fill: #15803d; }
      .lbl-no { fill: #be123c; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#be123c" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1500" height="1780" />
  <text class="title" x="40" y="46">Gruppenmarge - Filterkette pro Verkaufszeile</text>
  <text class="subtitle" x="40" y="70">Zu docs/FINANCE_GRUPPENMARGE_2026-06-16.md | Stand 2026-07-27 | Grundregel: fehlende Daten werden nie geschaetzt - offene Zeilen zeigen "-"</text>

  <!-- ================= R0 START ================= -->
  <rect class="prep" x="460" y="100" width="460" height="70" rx="8" />
  <text class="box-title" x="480" y="126">Verkaufszeile</text>
  <text class="small" x="480" y="147">Umsatz, SupplierNumber/-Name/-Country, Material, Land (TSC)</text>
  <path class="line" d="M690 170 V205" />

  <!-- ================= R1 Filter 1: Lieferant erkennbar? ================= -->
  <rect class="check" x="460" y="205" width="460" height="110" rx="8" />
  <text class="box-title" x="480" y="230">Filter 1: Lieferant erkennbar?</text>
  <text class="small" x="480" y="253">Sind SupplierNumber, -Name UND -Country</text>
  <text class="small" x="480" y="271">ALLE drei leer?</text>
  <text class="tiny" x="480" y="297">(GroupMarginSupplierClassifier.Resolve)</text>

  <text class="lbl lbl-no" x="932" y="228">JA -&gt;</text>
  <path class="line-no" d="M920 250 H990" />
  <rect class="issue" x="990" y="205" width="440" height="110" rx="8" />
  <text class="box-title" x="1010" y="230">Status: "Lieferant unklar"</text>
  <text class="small" x="1010" y="253">Marge/% bleiben offen ("-").</text>
  <text class="small" x="1010" y="271">Betrifft strukturell CH/AT, UK, ES: die Quelle</text>
  <text class="small" x="1010" y="289">liefert dort gar keine Lieferantenfelder.</text>

  <text class="lbl lbl-yes" x="700" y="332">NEIN, mindestens ein Feld gefuellt</text>
  <path class="line-yes" d="M690 315 V350" />

  <!-- ================= R2 Filter 2: Intern/Extern ================= -->
  <rect class="check" x="460" y="350" width="460" height="110" rx="8" />
  <text class="box-title" x="480" y="375">Filter 2: Interner Lieferant?</text>
  <text class="small" x="480" y="398">Wortgrenzen-Pruefung auf TRAFAG / TR-AG /</text>
  <text class="small" x="480" y="416">TRCH / TRIT / TRIN / GFS in Nummer/Name</text>
  <text class="tiny" x="480" y="442">(kein einfaches "enthaelt" - sonst waeren "Triton"</text>
  <text class="tiny" x="480" y="457">oder "AGFS-100" faelschlich intern)</text>

  <text class="lbl lbl-no" x="925" y="373">NEIN =</text>
  <text class="lbl lbl-no" x="925" y="388">extern</text>
  <path class="line-no" d="M920 395 H990" />
  <rect class="run" x="990" y="350" width="440" height="110" rx="8" />
  <text class="box-title" x="1010" y="375">Externer Lieferant</text>
  <text class="small" x="1010" y="398">Kostenbasis kommt direkt aus der eigenen</text>
  <text class="small" x="1010" y="416">Verkaufszeile (StandardCost lokal, z.B. CH/AT</text>
  <text class="small" x="1010" y="434">WAVWR/STPRS, B1 StockPrice, Alphaplan-Diff).</text>
  <path class="line-yes" d="M1210 460 V495 H705 V530" />

  <text class="lbl lbl-yes" x="700" y="477">JA, intern (Trafag/GFS)</text>
  <path class="line-yes" d="M690 460 V495" />

  <!-- ================= R3 Filter 3: Welche Gesellschaft ================= -->
  <rect class="check" x="460" y="530" width="460" height="230" rx="8" />
  <text class="box-title" x="480" y="555">Filter 3 (nur intern): welche Gesellschaft?</text>
  <text class="tiny" x="480" y="573">Klartext-Erkennung im Lieferantennamen (ResolveDeliveringEntity)</text>

  <text class="small" x="480" y="600">Trafag AG</text>
  <text class="tiny" x="480" y="617">Konzerntabelle vorhanden (MBEW-STPRS, BWK 1100).</text>
  <text class="tiny" x="480" y="632">Treffer fuer Material? JA: Konzernkosten TR AG. NEIN: Fallback lokal.</text>

  <text class="small" x="480" y="659">Trafag Italien</text>
  <text class="tiny" x="480" y="676">Noch KEINE Konzerntabelle verlinkt -&gt; aktuell Fallback lokal.</text>
  <text class="tiny" x="480" y="691">NEU 27.07.: Weg gefunden - Beleg-StockPrice der TR-IT-Zeile,</text>
  <text class="tiny" x="480" y="706">97% gefuellt - noch nicht umgesetzt.</text>

  <text class="small" x="480" y="730">Trafag Indien / GFS / unbekannt intern</text>
  <text class="tiny" x="480" y="745">Ebenfalls noch keine Konzerntabelle -&gt; Fallback lokal.</text>

  <path class="line" d="M690 760 V800" />

  <!-- ================= R4 merge: Kostenbasis bestimmt ================= -->
  <rect class="run" x="460" y="800" width="460" height="75" rx="8" />
  <text class="box-title" x="480" y="825">Kostenbasis der Zeile</text>
  <text class="small" x="480" y="848">= Menge &#215; StandardCost (aus der oben bestimmten Quelle)</text>
  <path class="line" d="M690 875 V910" />

  <!-- ================= R5 Filter 4: Kostenbasis > 0? ================= -->
  <rect class="check" x="460" y="910" width="460" height="100" rx="8" />
  <text class="box-title" x="480" y="935">Filter 4: Kostenbasis vorhanden?</text>
  <text class="small" x="480" y="958">Liefert die Quelle ueberhaupt einen</text>
  <text class="small" x="480" y="976">Stueckpreis (StandardCost &gt; 0)?</text>

  <text class="lbl lbl-no" x="932" y="933">NEIN -&gt;</text>
  <path class="line-no" d="M920 955 H990" />
  <rect class="issue" x="990" y="910" width="440" height="100" rx="8" />
  <text class="box-title" x="1010" y="935">Status: "Standardpreis fehlt"</text>
  <text class="small" x="1010" y="958">Umsatz zaehlt trotzdem, Marge bleibt offen.</text>
  <text class="small" x="1010" y="976">Nie geschaetzt, nie als 0-Kosten gedeutet.</text>

  <text class="lbl lbl-yes" x="700" y="1027">JA</text>
  <path class="line-yes" d="M690 1010 V1045" />

  <!-- ================= R6 Filter 5: Kostenwaehrung ================= -->
  <rect class="check" x="460" y="1045" width="460" height="130" rx="8" />
  <text class="box-title" x="480" y="1070">Filter 5: Kostenwaehrung = Verkaufswaehrung?</text>
  <text class="tiny" x="480" y="1088">(Schalter GroupMarginCostCurrencyMode)</text>
  <text class="small" x="480" y="1112">Ungleich UND Mask: bleibt offen.</text>
  <text class="small" x="480" y="1130">Ungleich UND Convert: Kostenbasis wird mit</text>
  <text class="small" x="480" y="1148">Jahreskurs 31.12. umgerechnet, Ablauf geht weiter.</text>

  <text class="lbl lbl-no" x="925" y="1073">Mask -&gt;</text>
  <path class="line-no" d="M920 1090 H990" />
  <rect class="issue" x="990" y="1045" width="440" height="60" rx="8" />
  <text class="box-title" x="1010" y="1068">Status: "Kostenwaehrung abweichend"</text>
  <text class="small" x="1010" y="1088">Marge bleibt offen, kein Waehrungsmix.</text>

  <text class="lbl lbl-yes" x="925" y="1123">Convert -&gt;</text>
  <path class="line-yes" d="M920 1140 H1010 V1115 H1210" />
  <rect class="run" x="990" y="1120" width="440" height="55" rx="8" />
  <text class="box-title" x="1010" y="1140">Umrechnung erfolgreich</text>
  <text class="small" x="1010" y="1160">Ablauf geht normal weiter -&gt; Berechnung.</text>
  <path class="line-yes" d="M1210 1120 V1210 H705 V1245" />

  <text class="lbl lbl-yes" x="700" y="1197">gleiche Waehrung</text>
  <path class="line-yes" d="M690 1175 V1245" />

  <!-- ================= R7 merge: Berechnung ================= -->
  <rect class="run" x="460" y="1245" width="460" height="95" rx="8" />
  <text class="box-title" x="480" y="1270">Berechnung</text>
  <text class="small" x="480" y="1293">Marge = Umsatz - Kostenbasis; Marge % = Marge / Umsatz</text>
  <text class="tiny" x="480" y="1313">Vorzeichen folgt dem Umsatz: Gutschrift -100, Kosten 60</text>
  <text class="tiny" x="480" y="1328">ergeben Marge -40, nicht -160.</text>
  <path class="line" d="M690 1340 V1375" />

  <!-- ================= R8 Filter 6: Aggregation ================= -->
  <rect class="check" x="460" y="1375" width="460" height="120" rx="8" />
  <text class="box-title" x="480" y="1400">Filter 6 (Aggregationsebene, Land/Sparte):</text>
  <text class="small" x="480" y="1423">Hat IRGENDEINE Zeile in dieser Gruppe einen</text>
  <text class="small" x="480" y="1441">offenen Status (aus Filter 1, 4 oder 5)?</text>
  <text class="tiny" x="480" y="1465">Betrifft z.B. CH/AT: Kostenbasis seit 16.07. gefuellt,</text>
  <text class="tiny" x="480" y="1480">aber Filter 1 (Lieferant unklar) maskiert sie weiterhin.</text>

  <text class="lbl lbl-no" x="932" y="1398">JA -&gt;</text>
  <path class="line-no" d="M920 1420 H990" />
  <rect class="issue" x="990" y="1375" width="440" height="120" rx="8" />
  <text class="box-title" x="1010" y="1400">Gesamte Gruppe zeigt "-"</text>
  <text class="small" x="1010" y="1423">Auch Zeilen, die einzeln OK waeren, werden in</text>
  <text class="small" x="1010" y="1441">Land-/Sparten-Summen als "-" ausgewiesen.</text>
  <text class="tiny" x="1010" y="1465">So bleibt sichtbar: die Gruppen-Marge ist als</text>
  <text class="tiny" x="1010" y="1480">Ganzes nicht belastbar, auch bei Teildaten.</text>

  <text class="lbl lbl-yes" x="700" y="1517">NEIN, keine offene Zeile in der Gruppe</text>
  <path class="line-yes" d="M690 1495 V1530" />

  <!-- ================= FINAL ================= -->
  <rect class="output" x="460" y="1530" width="460" height="75" rx="8" />
  <text class="box-title" x="480" y="1558">Ergebnis: belastbare Marge</text>
  <text class="small" x="480" y="1581">Echte Marge und Marge % werden angezeigt.</text>

  <!-- Right trunk collecting all "offen" exits -->
  <path class="line-no" d="M1130 260 H1350 V1435 H1130" />
  <path class="line-no" d="M1130 960 H1350" />
  <path class="line-no" d="M1130 1075 H1350" />

  <rect class="issue" x="990" y="1530" width="440" height="75" rx="8" />
  <text class="box-title" x="1010" y="1558">Ergebnis: Marge/% zeigt "-"</text>
  <text class="small" x="1010" y="1581">Status bleibt sichtbar - nie geschaetzt, nie verworfen.</text>
  <path class="line-no" d="M1130 1435 V1530" />

  <!-- ================= Footer / legend ================= -->
  <rect class="lane" x="40" y="1635" width="1420" height="105" rx="8" />
  <text class="box-title" x="60" y="1662">Merksatz</text>
  <text class="txt" x="60" y="1686">Jede Zeile durchlaeuft die Filterkette einzeln. Ein "-" bedeutet nie "keine Marge", sondern "Kostenbasis noch nicht geklaert".</text>
  <text class="small" x="60" y="1708">Gestrichelt markierte Wege in Filter 3 (Trafag Italien/Indien) sind Stand 2026-07-27 fachlich identifiziert, aber technisch noch nicht umgesetzt.</text>
  <text class="tiny" x="60" y="1728">Details/Zahlen: docs/FINANCE_GRUPPENMARGE_2026-06-16.md, docs/FINANCE_STANDARDKOSTEN_SITZUNG_ANDREAS_2026-07-27.md</text>

  <rect class="prep" x="1200" y="1645" width="18" height="14" rx="3" />
  <text class="tiny" x="1224" y="1657">Eingabe</text>
  <rect class="check" x="1200" y="1665" width="18" height="14" rx="3" />
  <text class="tiny" x="1224" y="1677">Filter/Entscheid</text>
  <rect class="run" x="1330" y="1645" width="18" height="14" rx="3" />
  <text class="tiny" x="1354" y="1657">Berechnung</text>
  <rect class="issue" x="1330" y="1665" width="18" height="14" rx="3" />
  <text class="tiny" x="1354" y="1677">Offen / "-"</text>
</svg>

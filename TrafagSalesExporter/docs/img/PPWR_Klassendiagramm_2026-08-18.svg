<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="640" viewBox="0 0 1040 640" font-family="Consolas, 'Courier New', monospace">
  <rect x="0" y="0" width="1040" height="640" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555555"/>
    </marker>
  </defs>

  <!-- Titel -->
  <text x="520" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">PPWR-Klassifizierung in SAP (T76 / Mandant 100)</text>

  <!-- Material-Box -->
  <rect x="370" y="46" width="300" height="60" rx="8" fill="#f2f2f2" stroke="#555555" stroke-width="1.5"/>
  <text x="520" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Material (MARA / MARC)</text>
  <text x="520" y="90" text-anchor="middle" font-size="12" fill="#333333">Materialart VERP, H*, Kaufteile</text>

  <!-- Standardfeld-Hinweis -->
  <line x1="670" y1="76" x2="820" y2="76" stroke="#999999" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="820" y="55" width="200" height="46" rx="6" fill="#fbf7ea" stroke="#c9b26a" stroke-width="1"/>
  <text x="920" y="70" text-anchor="middle" font-size="11" fill="#5a4a1a">MAGRV, BRGEW, NTGEW</text>
  <text x="920" y="84" text-anchor="middle" font-size="11" fill="#5a4a1a">bleiben Standardfeld</text>
  <text x="920" y="97" text-anchor="middle" font-size="10" fill="#8a7a3a">keine Dopplung im Merkmal</text>

  <!-- Linien zu den Klassen -->
  <line x1="470" y1="106" x2="280" y2="150" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="570" y1="106" x2="770" y2="150" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="330" y="130" font-size="11" fill="#555555">Klassifizierung</text>
  <text x="620" y="130" font-size="11" fill="#555555">CL03 / MM02, Klassenart 001</text>

  <!-- Klasse ZPPWR_PACKMITTEL -->
  <g>
    <rect x="30" y="150" width="470" height="360" rx="8" fill="#ffffff" stroke="#2f7d6e" stroke-width="1.5"/>
    <rect x="30" y="150" width="470" height="40" rx="8" fill="#2f7d6e"/>
    <rect x="30" y="176" width="470" height="14" fill="#2f7d6e"/>
    <text x="265" y="175" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Klasse: ZPPWR_PACKMITTEL</text>
    <text x="265" y="203" text-anchor="middle" font-size="11" fill="#2f7d6e" font-style="italic">"PPWR Packmittel"</text>

    <text x="48" y="228" font-size="12.5" fill="#1a1a1a">ZPPWR_RECYCL_CLASS    A .. E</text>
    <text x="48" y="252" font-size="12.5" fill="#1a1a1a">ZPPWR_RECYCLAT_PCT    0 - 100 %</text>
    <text x="48" y="276" font-size="12.5" fill="#1a1a1a">ZPPWR_PCR_PCT         0 - 100 %</text>
    <text x="48" y="300" font-size="12.5" fill="#1a1a1a">ZPPWR_DECL_STATUS     YES / NO / UNDEFINED</text>
    <text x="48" y="324" font-size="12.5" fill="#1a1a1a">ZPPWR_DECL_DATE       Datum</text>
    <text x="48" y="348" font-size="12.5" fill="#1a1a1a">ZPPWR_VALID_TO        Datum</text>
    <text x="48" y="372" font-size="12.5" fill="#1a1a1a">ZPPWR_DECL_REF        Referenz-ID</text>
    <text x="48" y="396" font-size="12.5" fill="#1a1a1a">ZPPWR_DATA_DATE       Datum</text>
    <text x="48" y="420" font-size="12.5" fill="#1a1a1a">ZPPWR_FOOD_CONTACT    YES / NO / UNDEFINED</text>

    <line x1="48" y1="440" x2="482" y2="440" stroke="#dddddd" stroke-width="1"/>
    <text x="265" y="462" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f7d6e">9 Merkmale</text>
    <text x="265" y="484" text-anchor="middle" font-size="11" fill="#555555">live geprueft in T76/100, 18.08.2026</text>
  </g>

  <!-- Klasse ZCOMP_STOFF -->
  <g>
    <rect x="540" y="150" width="470" height="360" rx="8" fill="#ffffff" stroke="#2a5c9e" stroke-width="1.5"/>
    <rect x="540" y="150" width="470" height="40" rx="8" fill="#2a5c9e"/>
    <rect x="540" y="176" width="470" height="14" fill="#2a5c9e"/>
    <text x="775" y="175" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Klasse: ZCOMP_STOFF</text>
    <text x="775" y="203" text-anchor="middle" font-size="11" fill="#2a5c9e" font-style="italic">"Stoffcompliance Interim"</text>

    <text x="558" y="223" font-size="11.5" fill="#1a1a1a">ZCOMP_REACH_STATUS    COMPLIANT / NON_COMPLIANT / UNDEFINED</text>
    <text x="558" y="245" font-size="11.5" fill="#1a1a1a">ZCOMP_REACH_DATE      Datum</text>
    <text x="558" y="267" font-size="11.5" fill="#1a1a1a">ZCOMP_SVHC_STATUS     COMPLIANT / NON_COMPLIANT / UNDEFINED</text>
    <text x="558" y="289" font-size="11.5" fill="#1a1a1a">ZCOMP_SVHC_LISTDAT    Datum (Kandidatenliste)</text>
    <text x="558" y="311" font-size="11.5" fill="#1a1a1a">ZCOMP_ROHS_STATUS     COMPLIANT / NON_COMPLIANT / UNDEFINED</text>
    <text x="558" y="333" font-size="11.5" fill="#1a1a1a">ZCOMP_ROHS_DATE       Datum</text>
    <text x="558" y="355" font-size="11.5" fill="#1a1a1a">ZCOMP_PFAS_STATUS     COMPLIANT / NON_COMPLIANT / UNDEFINED</text>
    <text x="558" y="377" font-size="11.5" fill="#1a1a1a">ZCOMP_PFAS_DATE       Datum</text>
    <text x="558" y="399" font-size="11.5" fill="#1a1a1a">ZCOMP_DECL_STATUS     YES / NO / UNDEFINED</text>
    <text x="558" y="421" font-size="11.5" fill="#1a1a1a">ZCOMP_DECL_DATE       Datum</text>
    <text x="558" y="443" font-size="11.5" fill="#1a1a1a">ZCOMP_VALID_TO        Datum</text>
    <text x="558" y="465" font-size="11.5" fill="#1a1a1a">ZCOMP_DECL_REF        Referenz-ID</text>

    <line x1="558" y1="478" x2="992" y2="478" stroke="#dddddd" stroke-width="1"/>
    <text x="775" y="497" text-anchor="middle" font-size="12" font-weight="bold" fill="#2a5c9e">12 Merkmale</text>
  </g>

  <!-- Fussnote -->
  <text x="520" y="530" text-anchor="middle" font-size="11.5" fill="#333333">Ein Material kann beiden Klassen zugeordnet sein, z. B. ein gekauftes Packmittel mit eigener Stoffbewertung.</text>
  <text x="520" y="550" text-anchor="middle" font-size="11.5" fill="#333333">Klassenart 001 kennt keinen Lieferantenbezug (Anlageprotokoll Abschnitt 10).</text>

  <rect x="30" y="575" width="980" height="46" rx="6" fill="#fdecec" stroke="#c0504d" stroke-width="1"/>
  <text x="520" y="595" text-anchor="middle" font-size="11.5" fill="#7a2320" font-weight="bold">Vor der Pilotzuordnung klaeren: Altklasse Z_PACK_REGULATION (Adil, unfertig) nicht mit ZPPWR_PACKMITTEL verwechseln.</text>
  <text x="520" y="612" text-anchor="middle" font-size="10.5" fill="#7a2320">Stand 18.08.2026 — docs/PPWR_MANDANT_100_ANALYSE_2026-08-18.md</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1300" viewBox="0 0 1800 1300">
  <defs>
    <style>
      .bg { fill: #f7f8fa; }
      .title { font: 700 34px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 16px Arial, sans-serif; fill: #4b5563; }
      .section { font: 700 18px Arial, sans-serif; fill: #111827; }
      .box-title { font: 700 15px Arial, sans-serif; fill: #111827; }
      .txt { font: 400 13px Arial, sans-serif; fill: #1f2937; }
      .small { font: 400 12px Arial, sans-serif; fill: #4b5563; }
      .tiny { font: 400 11px Arial, sans-serif; fill: #4b5563; }
      .lane { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.2; }
      .prep { fill: #e8f2ff; stroke: #2563eb; stroke-width: 1.5; }
      .run { fill: #eaf8ef; stroke: #15803d; stroke-width: 1.5; }
      .check { fill: #fffbeb; stroke: #d97706; stroke-width: 1.5; }
      .issue { fill: #fff1f2; stroke: #be123c; stroke-width: 1.5; }
      .output { fill: #eef2ff; stroke: #4338ca; stroke-width: 1.5; }
      .admin { fill: #f0ecff; stroke: #6d28d9; stroke-width: 1.5; }
      .line { stroke: #374151; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .line-soft { stroke: #6b7280; stroke-width: 1.2; fill: none; marker-end: url(#arrowSoft); }
      .dash { stroke-dasharray: 6 5; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151" />
    </marker>
    <marker id="arrowSoft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1800" height="1300" />
  <text class="title" x="48" y="58">Standardkosten und Gruppenmarge - von der Quelle bis ins zentrale Excel</text>
  <text class="subtitle" x="50" y="86">Stand 2026-07-17 | Zielgruppe: Finance Keyuser / Finance-Leitung | Grundregel: fehlende Daten werden nie geschaetzt, offene Zeilen zeigen keine Marge</text>

  <!-- Lanes -->
  <rect class="lane" x="40" y="120" width="410" height="960" rx="8" />
  <text class="section" x="65" y="155">A. Woher die Standardkosten kommen</text>

  <rect class="lane" x="480" y="120" width="410" height="960" rx="8" />
  <text class="section" x="505" y="155">B. Wie gerechnet wird</text>

  <rect class="lane" x="920" y="120" width="410" height="960" rx="8" />
  <text class="section" x="945" y="155">C. Wenn Felder fehlen (Status)</text>

  <rect class="lane" x="1360" y="120" width="400" height="960" rx="8" />
  <text class="section" x="1385" y="155">D. Anzeige und zentrales Excel</text>

  <!-- A: sources -->
  <rect class="prep" x="70" y="185" width="350" height="115" rx="8" />
  <text class="box-title" x="90" y="212">CH/AT (SAP OData)</text>
  <text class="small" x="90" y="236">VBRP-WAVWR (Wareneinsatz der Verkaufszeile) / Menge</text>
  <text class="small" x="90" y="254">Rueckfall ohne Lieferbezug: MBEW-STPRS (Materialstamm)</text>
  <text class="small" x="90" y="272">Waehrung: Belegwaehrung bzw. Hauswaehrung</text>
  <text class="small" x="90" y="290">Fuellgrad nach Reimport: TRCH 96.5%, TRAT 99.9%</text>

  <rect class="prep" x="70" y="330" width="350" height="95" rx="8" />
  <text class="box-title" x="90" y="357">Deutschland (Alphaplan)</text>
  <text class="small" x="90" y="381">(NettoPreisGesamt - RohertragGesamt) / Menge</text>
  <text class="small" x="90" y="399">wird beim Import abgeleitet, Waehrung EUR</text>

  <rect class="prep" x="70" y="455" width="350" height="95" rx="8" />
  <text class="box-title" x="90" y="482">FR / IT / US / IN (SAP B1)</text>
  <text class="small" x="90" y="506">Positionsfeld StockPrice der Verkaufszeile</text>
  <text class="small" x="90" y="524">Waehrung: Hauswaehrung der Gesellschaft</text>

  <rect class="issue" x="70" y="580" width="350" height="110" rx="8" />
  <text class="box-title" x="90" y="607">ES / UK</text>
  <text class="small" x="90" y="631">ES: Kostenspalte aus dem Sage-Export, sofern geliefert</text>
  <text class="small" x="90" y="649">UK: aktuell keine Kostenquelle im Export</text>
  <text class="small" x="90" y="667">UK-Kostenbasis fehlt durchgaengig - offener Punkt</text>

  <rect class="admin" x="70" y="720" width="350" height="130" rx="8" />
  <text class="box-title" x="90" y="747">Von TR AG gelieferte Artikel</text>
  <text class="small" x="90" y="771">echte Konzern-Herstellkosten: MBEW-STPRS der Trafag AG</text>
  <text class="small" x="90" y="789">Tabelle GroupStandardCosts, Waehrung CHF</text>
  <text class="small" x="90" y="807">ersetzt die lokale Kostenbasis, egal welches Land verkauft</text>
  <text class="small" x="90" y="825">Voraussetzung: Lieferant erkannt + Materialtreffer</text>

  <rect class="check" x="70" y="880" width="350" height="110" rx="8" />
  <text class="box-title" x="90" y="907">Merksatz Quelle</text>
  <text class="small" x="90" y="931">Standardkosten = Bewertungspreis pro Stueck aus dem</text>
  <text class="small" x="90" y="949">Quellsystem. Kein Einkaufspreis des einzelnen Belegs,</text>
  <text class="small" x="90" y="967">keine Nachkalkulation.</text>

  <!-- B: calculation -->
  <rect class="run" x="510" y="185" width="350" height="110" rx="8" />
  <text class="box-title" x="530" y="212">1. Stueckpreis sicherstellen</text>
  <text class="small" x="530" y="236">StandardCost ist immer ein Preis pro Stueck.</text>
  <text class="small" x="530" y="254">Zeilensummen (WAVWR, Rohertrag) werden durch die Menge,</text>
  <text class="small" x="530" y="272">STPRS durch die Preiseinheit geteilt.</text>

  <rect class="run" x="510" y="330" width="350" height="125" rx="8" />
  <text class="box-title" x="530" y="357">2. Lieferantentyp erkennen</text>
  <text class="small" x="530" y="381">aus Lieferantennummer, -name und -land:</text>
  <text class="small" x="530" y="399">Trafag/GFS im Text = Intern, sonst Extern</text>
  <text class="small" x="530" y="417">alle drei Felder leer = Unklar</text>
  <text class="small" x="530" y="435">Intern + TR-AG-Treffer: Konzernkosten statt lokale Kosten</text>

  <rect class="run" x="510" y="490" width="350" height="110" rx="8" />
  <text class="box-title" x="530" y="517">3. Kostenbasis der Zeile</text>
  <text class="small" x="530" y="541">Kostenbasis = Menge x StandardCost</text>
  <text class="small" x="530" y="559">Vorzeichen folgt dem Umsatz: Gutschrift -100 und</text>
  <text class="small" x="530" y="577">Kosten 60 ergeben Marge -40, nicht -160</text>

  <rect class="run" x="510" y="635" width="350" height="110" rx="8" />
  <text class="box-title" x="530" y="662">4. Marge</text>
  <text class="small" x="530" y="686">Marge = Umsatz - Kostenbasis, Marge % = Marge / Umsatz</text>
  <text class="small" x="530" y="704">nur wenn die Kostenbasis der Zeile geklaert ist -</text>
  <text class="small" x="530" y="722">sonst bleibt die Marge offen (-)</text>

  <rect class="output" x="510" y="780" width="350" height="130" rx="8" />
  <text class="box-title" x="530" y="807">5. Waehrung</text>
  <text class="small" x="530" y="831">Marge CHF: Umrechnung mit dem Jahreskurs (31.12.)</text>
  <text class="small" x="530" y="849">des Finance-Jahres der jeweiligen Zeile</text>
  <text class="small" x="530" y="867">Kostenwaehrung abweichend: Schalter Mask (offen lassen)</text>
  <text class="small" x="530" y="885">oder Convert (mit Jahreskurs umrechnen)</text>

  <!-- C: missing fields -->
  <rect class="issue" x="950" y="185" width="350" height="95" rx="8" />
  <text class="box-title" x="970" y="212">Standardpreis fehlt</text>
  <text class="small" x="970" y="236">Kostenbasis der Zeile ist 0 - Quelle liefert keinen Preis</text>
  <text class="small" x="970" y="254">Umsatz zaehlt, Marge bleibt offen. Nie als 100% deuten!</text>

  <rect class="issue" x="950" y="310" width="350" height="130" rx="8" />
  <text class="box-title" x="970" y="337">Lieferant unklar</text>
  <text class="small" x="970" y="361">Nummer, Name und Land des Lieferanten sind alle leer</text>
  <text class="small" x="970" y="379">Marge bleibt offen, auch wenn Standardkosten da sind</text>
  <text class="small" x="970" y="397">betrifft strukturell CH/AT, UK, ES - deren Quellen</text>
  <text class="small" x="970" y="415">liefern kein Lieferantenfeld (Befund 2026-07-17, offen)</text>

  <rect class="issue" x="950" y="470" width="350" height="95" rx="8" />
  <text class="box-title" x="970" y="497">Kostenwaehrung abweichend</text>
  <text class="small" x="970" y="521">Kosten- und Verkaufswaehrung unterschiedlich, Modus Mask</text>
  <text class="small" x="970" y="539">verhindert Waehrungsmix in einer Zahl</text>

  <rect class="issue" x="950" y="595" width="350" height="95" rx="8" />
  <text class="box-title" x="970" y="622">Kurs fehlt</text>
  <text class="small" x="970" y="646">kein CHF-Jahreskurs fuer Jahr/Waehrung gepflegt</text>
  <text class="small" x="970" y="664">Zeile bleibt lokal und wird per Hinweis ausgewiesen</text>

  <rect class="check" x="950" y="720" width="350" height="130" rx="8" />
  <text class="box-title" x="970" y="747">Grundregel</text>
  <text class="small" x="970" y="771">Fehlende Daten werden nie geschaetzt.</text>
  <text class="small" x="970" y="789">Jede offene Zeile behaelt ihren Status.</text>
  <text class="small" x="970" y="807">Hat ein Land/eine Sparte auch nur eine offene Zeile,</text>
  <text class="small" x="970" y="825">zeigt die Aggregation ebenfalls '-'</text>

  <!-- D: outputs -->
  <rect class="output" x="1390" y="185" width="340" height="95" rx="8" />
  <text class="box-title" x="1410" y="212">Gruppenmarge (Dashboard)</text>
  <text class="small" x="1410" y="236">Management Analyse &gt; Experten &gt; Gruppenmarge</text>
  <text class="small" x="1410" y="254">Umsatz, Kostenbasis, Marge, offene Zeilen je Land/Sparte</text>

  <rect class="output" x="1390" y="310" width="340" height="110" rx="8" />
  <text class="box-title" x="1410" y="337">Finance Pruefbuch</text>
  <text class="small" x="1410" y="361">zeilenweise Pruefsicht: Kurs, Lieferant, Standardkosten,</text>
  <text class="small" x="1410" y="379">Kostenbasis, Marge, Pruefstatus</text>
  <text class="small" x="1410" y="397">eigener Excel-Export mit Gruppenmarge Detail</text>

  <rect class="output" x="1390" y="450" width="340" height="110" rx="8" />
  <text class="box-title" x="1410" y="477">Zentrales Excel Sales_All</text>
  <text class="small" x="1410" y="501">Blaetter Gruppenmarge Summary + Gruppenmarge Details</text>
  <text class="small" x="1410" y="519">gleiche Berechnung wie das Dashboard -</text>
  <text class="small" x="1410" y="537">Finance prueft alles in einer Datei gegen</text>

  <rect class="output" x="1390" y="590" width="340" height="95" rx="8" />
  <text class="box-title" x="1410" y="617">Nachweis-Excel</text>
  <text class="small" x="1410" y="641">Formel-Summaries (SUMIFS/COUNTIFS) und Detailblaetter</text>
  <text class="small" x="1410" y="659">inkl. Gruppenmarge fuer die Excel-Gegenprobe</text>

  <rect class="admin" x="1390" y="720" width="340" height="170" rx="8" />
  <text class="box-title" x="1410" y="747">Deckungsbeitrag (vorbereitet, Daten offen)</text>
  <text class="small" x="1410" y="771">DB = Umsatz - variable Kosten (Finance-Sicht: fix</text>
  <text class="small" x="1410" y="789">bleibt bestehen, variabel entfaellt bei Artikelwegfall)</text>
  <text class="small" x="1410" y="807">DB-Spalten existieren im Gruppenmarge-Reiter und im</text>
  <text class="small" x="1410" y="825">zentralen Excel (Details/Summary) - sie bleiben LEER,</text>
  <text class="small" x="1410" y="843">bis die Quellen den fix/variabel-Split liefern</text>
  <text class="small" x="1410" y="861">(neue Felder StandardCostVariable/-Fixed, nie geschaetzt)</text>

  <!-- Arrows -->
  <path class="line" d="M420 242 H510" />
  <path class="line" d="M420 377 H510" />
  <path class="line" d="M420 502 H510" />
  <path class="line" d="M420 635 H510" />
  <path class="line" d="M420 785 H520 V780" />
  <path class="line-soft dash" d="M860 240 H950" />
  <path class="line-soft dash" d="M860 392 H950" />
  <path class="line-soft dash" d="M860 845 H942 V612 H950" />
  <path class="line" d="M860 690 H1330 V232 H1390" />
  <path class="line" d="M1330 232 V365 H1390" />
  <path class="line" d="M1330 365 V505 H1390" />
  <path class="line" d="M1330 505 V637 H1390" />

  <!-- Bottom summary -->
  <rect class="lane" x="40" y="1110" width="1720" height="110" rx="8" />
  <text class="section" x="60" y="1140">Merksatz fuer Finance</text>
  <text class="txt" x="60" y="1167">Die heutige Marge ist eine Bruttomarge auf Basis der vollen Standardkosten. Offene Zeilen (Standardpreis fehlt, Lieferant unklar, Kostenwaehrung abweichend, Kurs fehlt) zeigen bewusst keine Marge.</text>
  <text class="small" x="60" y="1193">Weicht eine Excel-Zahl vom Dashboard ab: zuerst pruefen, ob nach dem letzten Standortexport die zentrale Datei neu erzeugt wurde. Fachliche Entscheide (CH/AT-Lieferantenregel, Deckungsbeitrag fix/variabel) liegen bei Finance/Andreas.</text>

  <!-- Legend -->
  <rect class="prep" x="60" y="1245" width="22" height="16" rx="3" />
  <text class="tiny" x="90" y="1258">Kostenquelle</text>
  <rect class="run" x="190" y="1245" width="22" height="16" rx="3" />
  <text class="tiny" x="220" y="1258">Berechnung</text>
  <rect class="issue" x="310" y="1245" width="22" height="16" rx="3" />
  <text class="tiny" x="340" y="1258">Fehlende Felder / offen</text>
  <rect class="output" x="480" y="1245" width="22" height="16" rx="3" />
  <text class="tiny" x="510" y="1258">Anzeige / Excel</text>
  <rect class="admin" x="620" y="1245" width="22" height="16" rx="3" />
  <text class="tiny" x="650" y="1258">Konzern / Ausblick</text>
  <text class="tiny" x="1330" y="1258">Quelle: ManagementCockpitService, ExcelExportService, SapCompositionService - Stand 2026-07-17</text>
</svg>

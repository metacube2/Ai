<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PPA Shop-Floor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23E8531A'/%3E%3Crect x='7' y='8' width='18' height='4' fill='%23fff'/%3E%3Crect x='7' y='15' width='12' height='3' fill='%23fff'/%3E%3Crect x='7' y='21' width='15' height='3' fill='%23fff'/%3E%3C/svg%3E">
<!-- Schrift wie im Cockpit (App.razor). Ohne Internet greifen die Ersatzschriften aus style.css. -->
<link href="https://fonts.googleapis.com/css?family=Open+Sans:400,600,700,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="rail" id="rail">
    <a class="brand" href="#/">
      <img class="brand-logo" src="logo.svg" alt="Trafag" onerror="if(!this.dataset.png){this.dataset.png=1;this.src='logo.png'}else{this.remove();document.getElementById('brandWord').hidden=false}">
      <span id="brandWord" class="brand-word" hidden>Trafag</span>
      <span class="brand-app">PPA Shop-Floor<small id="brandYear"></small></span>
    </a>
    <nav id="nav" aria-label="Module"></nav>
    <div class="rail-foot">
      <a href="#/mail">Personen &amp; Mail</a> · <a href="#/schnittstelle">Schnittstelle SAP / MES</a>
    </div>
  </aside>
  <div class="main">
    <header class="top">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menü öffnen">☰</button>
      <div id="meetingBar" class="meeting-bar" hidden></div>
      <div class="top-right">
        <span id="syncState" class="sync" title="Daten werden alle 30 Sekunden aktualisiert"></span>
        <button class="user-chip" id="userChip" title="Kürzel ändern"></button>
      </div>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>
</div>
<div id="drawer" class="drawer" hidden aria-modal="true" role="dialog"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>

services:
  kompass:
    build: .
    image: kompass:local
    container_name: kompass
    restart: unless-stopped
    ports:
      - "8096:8000"
    environment:
      - TZ=Europe/Zurich
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/gesund')"]
      interval: 60s
      timeout: 5s
      retries: 3

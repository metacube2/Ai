<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14181d" media="(prefers-color-scheme: dark)">
<meta name="csrf" content="{{ csrf_token() }}">
<title>{% block titel %}Kompass{% endblock %}</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="{{ url_for('static', filename='icon.svg') }}" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='icon-180.png') }}">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kompass">
<link rel="stylesheet" href="{{ url_for('static', filename='stil.css') }}?v=1">
{% block kopf %}{% endblock %}
</head>
<body class="{% block koerper %}{% endblock %}"{% block koerper_daten %}{% endblock %}>
{% block inhalt %}{% endblock %}
</body>
</html>

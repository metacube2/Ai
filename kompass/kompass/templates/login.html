{% extends "basis.html" %}
{% block titel %}Anmelden · Kompass{% endblock %}
{% block inhalt %}
<main class="login">
  <form method="post" class="karte login-karte">
    <div class="marke"><img src="{{ url_for('static', filename='icon.svg') }}" alt="" width="40" height="40"><span>Kompass</span></div>
    <p class="leise">Schön, dass du da bist.</p>
    {% for m in get_flashed_messages() %}<p class="meldung" role="alert">{{ m }}</p>{% endfor %}
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label>Login<input name="login" value="admin" autocomplete="username" autocapitalize="none" required></label>
    <label>Passwort<input name="passwort" type="password" autocomplete="current-password" required autofocus></label>
    <button class="knopf haupt" type="submit">Anmelden</button>
  </form>
</main>
{% endblock %}

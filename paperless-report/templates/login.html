<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paperless Finance Login</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --text: #17202a;
      --muted: #687384;
      --line: #d9dee7;
      --accent: #2563eb;
      --danger: #b91c1c;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--bg);
    }
    main {
      width: min(420px, calc(100vw - 32px));
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 24px;
    }
    h1 { margin: 0 0 18px; font-size: 22px; letter-spacing: 0; }
    label { display: grid; gap: 6px; margin: 12px 0; color: var(--muted); font-size: 13px; }
    input, button {
      width: 100%;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 10px;
      font: inherit;
    }
    button {
      margin-top: 10px;
      border-color: var(--accent);
      background: var(--accent);
      color: white;
      font-weight: 650;
      cursor: pointer;
    }
    .error { color: var(--danger); margin: 0 0 12px; font-weight: 650; }
  </style>
</head>
<body>
  <main>
    <h1>Paperless Finance</h1>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post">
      <label>Benutzer <input name="username" autocomplete="username" autofocus></label>
      <label>Passwort <input name="password" type="password" autocomplete="current-password"></label>
      <button type="submit">Login</button>
    </form>
  </main>
</body>
</html>

<div class="feldreihe linkzeile">
  <label class="feld schmal auswahl"><select name="dienst">{% for k, v in DIENSTE.items() %}<option value="{{ k }}" {{ 'selected' if k == d }}>{{ v }}</option>{% endfor %}</select><span>Dienst</span></label>
  <label class="feld"><input name="url" type="url" value="{{ u }}" placeholder=" "><span>Link https://…</span></label>
  <label class="feld"><input name="bezeichnung" value="{{ b }}" placeholder=" "><span>Bezeichnung</span></label>
</div>

<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0a12">
<title>{% block titel %}Bilder von uns{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='stil.css') }}?v=2">
<script src="{{ url_for('static', filename='app.js') }}?v=2" defer></script>
<link rel="icon" href="{{ url_for('static', filename='icon.svg') }}" type="image/svg+xml">
</head>
<body class="{% block koerper %}{% endblock %}">
<div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>
<div class="koernung" aria-hidden="true"></div>
<header class="kopf">
  <a class="marke" href="{{ url_for('start') }}">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7a59"/><stop offset=".5" stop-color="#ff3d9a"/><stop offset="1" stop-color="#7c5cff"/></linearGradient></defs><rect width="32" height="32" rx="10" fill="url(#lg)"/><circle cx="12" cy="12.5" r="3.4" fill="#fff"/><path d="M5 25l7.5-7.5 4 4 5.5-6.5 5 10z" fill="#fff" opacity=".95"/></svg>
    <span>Bilder von uns</span>
  </a>
  {% if g.konto %}
  <nav class="menue">
    {% if g.konto.admin %}<a class="pille {{ 'aktiv' if request.endpoint and request.endpoint.startswith(('admin','anlass','familie')) }}" href="{{ url_for('admin') }}">Verwalten</a>{% endif %}
    <span class="avatar" title="{{ g.konto.name }}">{{ g.konto.name[:1]|upper }}</span>
    <form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><button class="geist" title="Abmelden" aria-label="Abmelden"><svg viewBox="0 0 24 24"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l5-5-5-5M15 12H3"/></svg></button></form>
  </nav>
  {% endif %}
</header>
<main>
  {% with meldungen = get_flashed_messages() %}{% for m in meldungen %}<p class="toast">{{ m }}</p>{% endfor %}{% endwith %}
  {% block inhalt %}{% endblock %}
</main>
<footer class="fuss">mit ♥ für die Familie</footer>
</body>
</html>

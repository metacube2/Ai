{% extends "basis.html" %}
{% block inhalt %}
<section class="karte login">
  <h1>Willkommen</h1>
  <p class="hinweis">Melde dich mit dem Login deiner Familie an.</p>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label>Login <input name="login" autocomplete="username" required autofocus></label>
    <label>Passwort <input name="passwort" type="password" autocomplete="current-password" required></label>
    <button>Anmelden</button>
  </form>
</section>
{% endblock %}
